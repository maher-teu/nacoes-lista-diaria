<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#072219}
body{font-family:Inter,'Helvetica Neue',Arial,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,#14513a 0%,#0b3627 45%,#061d15 100%)}
.abs{position:absolute;will-change:transform,opacity}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55}
#grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;pointer-events:none}
.kicker{left:70px;top:118px;display:inline-flex;align-items:center;gap:12px;padding:12px 22px;border-radius:99px;background:#f2b84b;color:#1b2a22;font-weight:800;font-size:28px;letter-spacing:.6px;text-transform:uppercase;white-space:nowrap}
.headline{left:70px;top:190px;width:950px;font-weight:800;font-size:78px;line-height:1.04;letter-spacing:-1.5px}
.w{display:inline-block;margin-right:.22em;will-change:transform,opacity,filter}
.gold{color:#f2b84b}
#phone{left:206px;top:458px;width:668px;height:1413px;border-radius:84px;background:#0d0f0e;padding:14px;box-shadow:0 60px 120px rgba(0,0,0,.55),0 0 0 2px rgba(255,255,255,.08) inset,0 0 0 1px #2b302d;transform-origin:50% 40%}
#screen{position:relative;width:640px;height:1385px;border-radius:70px;overflow:hidden;background:#f6f5f1}
#screen img.sc{position:absolute;inset:0;width:640px;height:1385px;object-fit:cover;opacity:0}
#island{position:absolute;left:50%;top:22px;width:190px;height:52px;margin-left:-95px;border-radius:30px;background:#0d0f0e;z-index:5}
.tap{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:6px solid #f2b84b;background:rgba(242,184,75,.28);z-index:6;opacity:0}
.finger{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 6px 20px rgba(0,0,0,.35);z-index:7;opacity:0}
.card{background:rgba(255,255,255,.96);color:#1c1f1d;border-radius:36px;box-shadow:0 30px 70px rgba(0,0,0,.35)}
.glass{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.18);border-radius:32px;backdrop-filter:blur(10px)}
.chip{display:inline-flex;align-items:center;gap:10px;padding:16px 26px;border-radius:99px;font-weight:800;font-size:32px;white-space:nowrap;box-shadow:0 18px 40px rgba(0,0,0,.3)}
.bubble{background:#fff;color:#1c1f1d;border-radius:34px 34px 34px 10px;padding:30px 34px;font-size:34px;line-height:1.4;white-space:pre-wrap;box-shadow:0 30px 70px rgba(0,0,0,.35)}
.wa{background:#d9fdd3;border-radius:34px 34px 10px 34px}
.ray{position:absolute;left:0;top:0;width:10px;height:70px;margin:-35px 0 0 -5px;border-radius:6px;background:#f2b84b}
.conf{position:absolute;width:18px;height:28px;border-radius:4px}
.mini{width:150px;height:96px;border-radius:22px;background:rgba(255,255,255,.95);display:flex;align-items:center;gap:12px;padding:0 16px;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.mini i{width:44px;height:44px;border-radius:50%;flex:none}
.mini b{display:block;width:64px;height:12px;border-radius:6px;background:#d8d6cf}
.stat{width:300px;padding:30px 30px 26px;color:#1c1f1d}
.stat .n{font-size:84px;font-weight:800;letter-spacing:-2px;line-height:1}
.stat .l{font-size:28px;font-weight:700;color:#5b605c;margin-top:8px}
</style></head>
<body><div id="stage"></div>
<script>
// ---------------------------------------------------------------- motor de timeline (determinístico)
const stage = document.getElementById('stage');
const TW = [];      // tweens
const FX = [];      // efeitos por quadro (texto, contadores)
const E = {
  lin: (p) => p,
  out: (p) => 1 - Math.pow(1 - p, 3),
  in: (p) => p * p * p,
  io: (p) => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  back: (p) => { const c = 1.70158, c3 = c + 1; return 1 + c3 * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); },
  expo: (p) => p === 1 ? 1 : 1 - Math.pow(2, -10 * p),
};
const DEF = { o: 1, x: 0, y: 0, s: 1, r: 0, b: 0, sx: 1, sy: 1 };
function el(tag, cls, parent, css, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (css) Object.assign(e.style, css);
  if (html != null) e.innerHTML = html;
  (parent || stage).appendChild(e);
  e._st = Object.assign({}, DEF);
  return e;
}
function tw(e, t0, t1, props, ease = 'out') { TW.push({ e, t0, t1, props, ease: E[ease] || E.out }); }
function set(e, props) { tw(e, -1, -1, Object.fromEntries(Object.entries(props).map(([k, v]) => [k, [v, v]]))); }
function fx(fn) { FX.push(fn); }
function render(t) {
  const st = new Map();
  for (const w of TW) {
    if (!st.has(w.e)) st.set(w.e, Object.assign({}, DEF));
    if (t < w.t0) continue;
    const s = st.get(w.e);
    const p = w.t1 > w.t0 ? Math.min(1, (t - w.t0) / (w.t1 - w.t0)) : 1;
    const k = w.ease(p);
    for (const [prop, [a, b]] of Object.entries(w.props)) s[prop] = a + (b - a) * k;
  }
  for (const [e, s] of st) {
    e.style.opacity = s.o;
    e.style.transform = `translate(${s.x}px,${s.y}px) scale(${s.s * s.sx},${s.s * s.sy}) rotate(${s.r}deg)`;
    e.style.filter = s.b > 0.05 ? `blur(${s.b}px)` : 'none';
    e.style.visibility = s.o <= 0.001 ? 'hidden' : 'visible';
  }
  for (const f of FX) f(t);
}
window.render = render;

// ---------------------------------------------------------------- peças reutilizáveis
function words(container, text, t0, gap = 0.06) {
  // anima palavra por palavra; *texto* fica dourado
  container.innerHTML = '';
  const out = [];
  let inGold = false;
  text.split(' ').forEach((w, i) => {
    if (w.startsWith('*')) { inGold = true; w = w.slice(1); }
    const gold = inGold;
    if (w.endsWith('*')) { inGold = false; w = w.slice(0, -1); }
    const s = document.createElement('span');
    s.className = 'w' + (gold ? ' gold' : '');
    s.textContent = w;
    s._st = Object.assign({}, DEF);
    container.appendChild(s);
    tw(s, -1, -1, { o: [0, 0] });
    tw(s, t0 + i * gap, t0 + i * gap + .55, { o: [0, 1], y: [46, 0], b: [10, 0] }, 'out');
    out.push(s);
  });
  return out;
}
function title(sc, kicker, text) {
  const k = el('div', 'abs kicker', null, {}, kicker);
  set(k, { o: 0 });
  tw(k, sc.t, sc.t + .45, { o: [0, 1], x: [-40, 0] }, 'out');
  tw(k, sc.end - .35, sc.end, { o: [1, 0], x: [0, 30] }, 'in');
  const h = el('div', 'abs headline');
  const ws = words(h, text, sc.t + .12);
  ws.forEach((w, i) => tw(w, sc.end - .4 + i * .015, sc.end - .05 + i * .015, { o: [1, 0], y: [0, -30], b: [0, 8] }, 'in'));
}

// telefone
let phone, screen, imgs = {};
function buildPhone(shots) {
  phone = el('div', 'abs', null, {});
  phone.id = 'phone';
  screen = el('div', '', phone); screen.id = 'screen';
  el('div', '', screen).id = 'island';
  shots.forEach((n) => {
    const i = document.createElement('img');
    i.className = 'sc'; i.src = `shots/${n}.png`;
    screen.appendChild(i); i._st = Object.assign({}, DEF);
    tw(i, -1, -1, { o: [0, 0] });
    imgs[n] = i;
  });
}
let shown = null;
function show(name, t, d = .35) {
  const i = imgs[name];
  if (shown && shown !== i) tw(shown, t + d, t + d + .01, { o: [1, 0] }, 'lin');
  tw(i, t, t + d, { o: [0, 1], s: [1.015, 1] }, 'out');
  shown = i;
}
function tap(fx_, fy, t) {
  const x = fx_ * 640, y = fy * 1385;
  const r = el('div', 'tap', screen, { left: x + 'px', top: y + 'px' });
  const f = el('div', 'finger', screen, { left: x + 'px', top: y + 'px' });
  set(r, { o: 0 }); set(f, { o: 0 });
  tw(f, t - .35, t - .1, { o: [0, 1], s: [1.4, 1], y: [40, 0] }, 'out');
  tw(f, t - .1, t, { s: [1, .8] }, 'io');
  tw(f, t, t + .15, { s: [.8, 1] }, 'out');
  tw(f, t + .35, t + .6, { o: [1, 0] }, 'in');
  tw(r, t, t + .65, { o: [1, 0], s: [.3, 1.7] }, 'out');
  SFX.push(['tap', t]);
}
const SFX = [];
function burst(parent, cx, cy, t, n = 12, rad = 150, color = '#f2b84b') {
  for (let k = 0; k < n; k++) {
    const a = (k / n) * 360;
    const r = el('div', 'ray', parent, { left: cx + 'px', top: cy + 'px', background: color });
    const rr = (a * Math.PI) / 180;
    set(r, { o: 0, r: a + 90 });
    tw(r, t, t + .55, { o: [1, 0], x: [0, Math.cos(rr) * rad], y: [0, Math.sin(rr) * rad], sy: [1.4, .2] }, 'out');
  }
}
function confetti(t) {
  const cols = ['#f2b84b', '#ffffff', '#4fc38f', '#ff8a65', '#9ad1ff'];
  for (let k = 0; k < 70; k++) {
    const c = el('div', 'conf', null, { left: (540 + (Math.random() - .5) * 200) + 'px', top: '900px', background: cols[k % cols.length] });
    const dx = (Math.random() - .5) * 1300, dy = -500 - Math.random() * 700;
    set(c, { o: 0 });
    tw(c, t, t + .9, { o: [1, 1], x: [0, dx * .7], y: [0, dy], r: [0, (Math.random() - .5) * 720] }, 'out');
    tw(c, t + .9, t + 2.6, { y: [dy, dy + 1500], x: [dx * .7, dx], r: [0, (Math.random() - .5) * 900], o: [1, 0] }, 'in');
  }
}
function counter(e, from, to, t0, t1, fmt = (v) => Math.round(v).toLocaleString('pt-BR')) {
  fx((t) => { const p = Math.max(0, Math.min(1, (t - t0) / (t1 - t0))); e.textContent = fmt(from + (to - from) * E.out(p)); });
}
function typer(e, text, t0, t1) {
  fx((t) => { const p = Math.max(0, Math.min(1, (t - t0) / (t1 - t0))); const n = Math.round(text.length * p); e.textContent = text.slice(0, n); });
}

// ---------------------------------------------------------------- cenas
function build(S, TAPS) {
  const sc = Object.fromEntries(S.map((s) => [s.id, Object.assign({ end: s.start + s.dur, t: s.start }, s)]));
  const at = (id, f) => sc[id].t + f * sc[id].dur;
  const TOTAL = S[S.length - 1].start + S[S.length - 1].dur;

  // fundo vivo
  const o1 = el('div', 'orb', null, { width: '760px', height: '760px', left: '-200px', top: '-160px', background: '#2f8f63' });
  const o2 = el('div', 'orb', null, { width: '640px', height: '640px', left: '600px', top: '1200px', background: '#f2b84b', opacity: '.22' });
  const o3 = el('div', 'orb', null, { width: '520px', height: '520px', left: '640px', top: '200px', background: '#1d6b4d' });
  tw(o1, 0, TOTAL, { x: [0, 260], y: [0, 380] }, 'lin');
  tw(o2, 0, TOTAL, { x: [0, -420], y: [0, -520] }, 'lin');
  tw(o3, 0, TOTAL, { x: [0, -300], y: [0, 500], s: [1, 1.3] }, 'lin');

  // ---------- A: abertura
  {
    const s = sc.A;
    const logo = el('div', 'abs', null, { left: '420px', top: '560px', width: '240px', height: '240px', borderRadius: '64px', background: '#1d6b4d', boxShadow: '0 40px 90px rgba(0,0,0,.45), inset 0 0 0 3px rgba(255,255,255,.15)', display: 'flex', alignItems: 'center', justifyContent: 'center' },
      `<svg width="128" height="128" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>`);
    set(logo, { o: 0, s: .2 });
    tw(logo, s.t + .2, s.t + .9, { o: [0, 1], s: [.2, 1], r: [-25, 0] }, 'back');
    burst(stage, 540, 680, s.t + .55, 14, 230);
    const ring = el('div', 'abs', null, { left: '360px', top: '500px', width: '360px', height: '360px', borderRadius: '50%', border: '6px solid #f2b84b' });
    set(ring, { o: 0 });
    tw(ring, s.t + .5, s.t + 1.3, { o: [1, 0], s: [.5, 1.5] }, 'out');
    SFX.push(['pop', s.t + .4], ['shimmer', s.t + .6]);
    const t1 = el('div', 'abs', null, { left: '0', width: '1080px', top: '880px', textAlign: 'center', fontWeight: 800, fontSize: '120px', letterSpacing: '-3px' });
    const ws = words(t1, 'Lista do Dia', s.t + .8, .1);
    const t2 = el('div', 'abs', null, { left: '0', width: '1080px', top: '1030px', textAlign: 'center', fontWeight: 700, fontSize: '50px', color: '#f2b84b', letterSpacing: '1px' }, 'Baummer Nações');
    set(t2, { o: 0 });
    tw(t2, s.t + 1.3, s.t + 1.9, { o: [0, 1], y: [30, 0] }, 'out');
    const line = el('div', 'abs', null, { left: '390px', top: '1110px', width: '300px', height: '6px', borderRadius: '6px', background: '#f2b84b', transformOrigin: '0 50%' });
    set(line, { sx: 0 });
    tw(line, s.t + 1.6, s.t + 2.3, { sx: [0, 1] }, 'io');
    const tag = el('div', 'abs', null, { left: '0', width: '1080px', top: '1200px', textAlign: 'center', fontSize: '40px', fontWeight: 600, opacity: .85 }, 'Guia rápido do app');
    set(tag, { o: 0 });
    tw(tag, s.t + 2.0, s.t + 2.6, { o: [0, .85], y: [20, 0] }, 'out');
    [logo, t1, t2, line, tag, ...ws].forEach((x) => tw(x, s.end - .5, s.end, { o: [x === tag ? .85 : 1, 0], y: [0, -80], b: [0, 10] }, 'in'));
    SFX.push(['whoosh', s.end - .45]);
  }

  // ---------- B: 7h, 50 clientes
  {
    const s = sc.B;
    title(s, 'Todo dia · 7h', '*50 clientes* escolhidas para você');
    const clock = el('div', 'abs card', null, { left: '290px', top: '560px', width: '500px', height: '250px', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '150px', fontWeight: 800, letterSpacing: '-4px', fontVariantNumeric: 'tabular-nums' });
    set(clock, { o: 0, s: .8 });
    tw(clock, s.t + .3, s.t + .8, { o: [0, 1], s: [.8, 1] }, 'back');
    const clk = el('span', '', clock);
    fx((t) => { const p = Math.max(0, Math.min(1, (t - s.t - .4) / 1.2)); const m = Math.round(-30 + 30 * E.out(p)); const hh = m < 0 ? 6 : 7; const mm = m < 0 ? 60 + m : m; clk.textContent = `0${hh}:${String(mm).padStart(2, '0')}`; });
    tw(clock, at('B', .45), at('B', .55), { y: [0, -60], s: [1, .7] }, 'io');
    SFX.push(['success', s.t + 1.6]);
    const minis = [];
    const colors = ['#f2b84b', '#4fc38f', '#ff8a65', '#9ad1ff', '#c59bff'];
    for (let k = 0; k < 30; k++) {
      const c = k % 5, r = Math.floor(k / 5);
      const m = el('div', 'abs mini', null, { left: (65 + c * 194) + 'px', top: (830 + r * 118) + 'px' }, `<i style="background:${colors[(k * 3) % 5]}"></i><span><b></b><b style="width:44px;margin-top:10px"></b></span>`);
      set(m, { o: 0 });
      const t0 = at('B', .5) + k * .035;
      tw(m, t0, t0 + .45, { o: [0, 1], y: [-260, 0], s: [.6, 1], r: [(k % 2 ? 8 : -8), 0] }, 'back');
      minis.push(m);
    }
    const chips = [['🎂 Aniversário', '#ffffff', 110, 1590, -4], ['💛 Sumida há meses', '#ffffff', 450, 1690, 3], ['🎄 Comprou no Natal', '#f2b84b', 170, 1790, -2]];
    chips.forEach(([txt, bg, x, y, r], i) => {
      const c = el('div', 'abs chip', null, { left: x + 'px', top: y + 'px', background: bg, color: '#1b2a22' }, txt);
      set(c, { o: 0, r });
      const t0 = at('B', .62) + i * .25;
      tw(c, t0, t0 + .5, { o: [0, 1], s: [.5, 1], y: [60, 0] }, 'back');
      SFX.push(['pop', t0 + .1]);
      tw(c, s.end - .4, s.end, { o: [1, 0], y: [0, 40] }, 'in');
    });
    [clock, ...minis].forEach((x, i) => tw(x, s.end - .45 + (i % 6) * .01, s.end, { o: [1, 0], s: [1, .85], b: [0, 6] }, 'in'));
  }

  // ---------- C: IA escreve
  {
    const s = sc.C;
    title(s, 'Inteligência artificial', 'Uma mensagem *para cada cliente*');
    const card = el('div', 'abs card', null, { left: '90px', top: '560px', width: '900px', height: '300px', display: 'flex', gap: '34px', alignItems: 'center', padding: '30px' },
      `<img src="assets/peca.jpg" style="width:240px;height:240px;object-fit:cover;border-radius:26px">
       <div><div style="font-size:26px;font-weight:800;color:#1d6b4d;letter-spacing:1px;text-transform:uppercase">Peça do catálogo</div>
       <div style="font-size:44px;font-weight:800;margin-top:8px;line-height:1.1">Colar de pérola dourado</div>
       <div style="font-size:30px;margin-top:14px;color:#5b605c">Ela comprou o <b style="color:#1c1f1d">brinco de pérola</b></div></div>`);
    set(card, { o: 0 });
    tw(card, s.t + .35, s.t + .85, { o: [0, 1], x: [-120, 0] }, 'out');
    SFX.push(['whoosh', s.t + .3]);
    const b = el('div', 'abs bubble', null, { left: '90px', top: '920px', width: '900px', minHeight: '560px' });
    set(b, { o: 0 });
    tw(b, s.t + .9, s.t + 1.3, { o: [0, 1], y: [60, 0] }, 'out');
    const txt = 'Oi, Ana! Aqui é da Baummer Nações 🎂\n\nParabéns adiantado pelo seu aniversário de quarta!\n\nSeparei o colar de pérola dourado, porque ele faz conjunto com o brinco de pérola que você levou ✨\n\nPosso te mandar a foto da peça? 💛';
    const span = el('span', '', b);
    typer(span, txt, s.t + 1.3, at('C', .8));
    const why = el('div', 'abs chip', null, { left: '540px', top: '1530px', background: '#f2b84b', color: '#1b2a22' }, '✨ o quê + o porquê');
    set(why, { o: 0, r: -3 });
    tw(why, at('C', .78), at('C', .78) + .5, { o: [0, 1], s: [.4, 1] }, 'back');
    SFX.push(['shimmer', at('C', .78)]);
    [card, b, why].forEach((x) => tw(x, s.end - .45, s.end, { o: [1, 0], y: [0, -60], b: [0, 8] }, 'in'));
  }

  // ---------- telefone (D até N)
  buildPhone(['s01_login', 's02_login_filled', 's03_hoje', 's04_card_msg', 's05_confirm', 's06_next', 's07_skip', 's08_lembrete', 's09_reply', 's10_follow', 's11_follow_btns', 's12_funil', 's13_funil_open', 's14_search', 's15_ficha', 's16_resultados', 's17_catalogo', 's18_campanha_vazia', 's19_campanha']);
  set(phone, { o: 0, y: 1500 });
  tw(phone, sc.D.t, sc.D.t + .9, { o: [1, 1], y: [1500, 0], r: [-8, 0], s: [.9, 1] }, 'expo');
  SFX.push(['whoosh', sc.D.t]);
  tw(phone, sc.O.t - .1, sc.O.t + .6, { y: [0, 1600], r: [0, 6] }, 'in');
  const P = TAPS;

  // ---------- D: entrar
  {
    const s = sc.D;
    title(s, 'Passo 1', 'Entrar e *salvar a senha*');
    show('s01_login', s.t);
    tap(.25, .495, at('D', .3));
    show('s02_login_filled', at('D', .45));
    tap(P.t_entrar[0], P.t_entrar[1], at('D', .62));
    const ios = el('div', 'abs card', null, { left: '250px', top: '1150px', width: '580px', padding: '34px 36px', textAlign: 'center' },
      `<div style="font-size:34px;font-weight:800">Salvar senha?</div><div style="font-size:26px;color:#5b605c;margin-top:8px">Ela entra sozinha da próxima vez</div>
       <div style="display:flex;gap:16px;margin-top:26px"><div style="flex:1;padding:18px;border-radius:18px;background:#eeede7;font-weight:700;font-size:28px">Agora não</div><div style="flex:1;padding:18px;border-radius:18px;background:#1d6b4d;color:#fff;font-weight:800;font-size:28px">Sim</div></div>`);
    set(ios, { o: 0 });

// grão (textura) gerado uma vez
(function grain() {
  const c = document.createElement('canvas'); c.width = 540; c.height = 960; c.id = 'grain';
  const g = c.getContext('2d'); const d = g.createImageData(540, 960);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); c.style.width = '1080px'; c.style.height = '1920px';
  document.body.appendChild(c);
})();

window.setup = (scenes, taps, seed) => {
  // aleatório com semente, para o vídeo sair sempre igual
  let x = seed || 7; Math.random = () => { x = (x * 16807) % 2147483647; return (x - 1) / 2147483646; };
  const r = build(scenes, taps);
  TW.sort((a, b) => a.t0 - b.t0);   // tweens em ordem de tempo: o mais recente vence
  render(0);
  return r;
};
